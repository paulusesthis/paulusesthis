<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none" role="img" aria-label="Abegunde Paul | Full-Stack Developer | AI/ML | UI/UX | Web3">
  <title>Abegunde Paul | Full-Stack Developer</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow-white" cx="82%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-soft" cx="15%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-line" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="219" rx="12" fill="url(#bg-grad)" stroke="#262626"/>
  <rect x="1" y="1" width="898" height="218" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="218" rx="12" fill="url(#glow-white)"/>
  <rect x="1" y="1" width="898" height="218" rx="12" fill="url(#glow-soft)"/>

  <!-- Status pill -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="248" height="24" rx="12" fill="#171717" stroke="#333333" stroke-width="1"/>
    <circle cx="15" cy="12" r="4" fill="#ffffff"/>
    <text x="27" y="16" font-family="'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#e5e5e5">AVAILABLE FOR COLLABORATION</text>
  </g>

  <!-- Main Heading -->
  <text x="48" y="106" font-family="'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8" fill="#ffffff">Abegunde Paul</text>

  <!-- Accent divider -->
  <rect x="48" y="120" width="160" height="3" rx="1.5" fill="url(#accent-line)"/>

  <!-- Role & Core Disciplines -->
  <text x="48" y="150" font-family="'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="500" fill="#d4d4d4">
    Full-Stack Developer  <tspan fill="#737373">|</tspan>  AI/ML  <tspan fill="#737373">|</tspan>  React · TypeScript · Python · UI/UX · Web3
  </text>

  <!-- Subtle tagline -->
  <text x="48" y="178" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#737373">
    Designing clean interfaces, resilient APIs, and intelligent software systems.
  </text>

  <!-- Minimal geometric motif on right -->
  <g transform="translate(720, 44)" opacity="0.95">
    <rect x="0" y="0" width="132" height="132" rx="14" fill="#0a0a0a" stroke="#262626" stroke-width="1.2"/>
    <circle cx="66" cy="66" r="42" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/>
    <circle cx="66" cy="66" r="28" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M51 56 L40 66 L51 76" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M81 56 L92 66 L81 76" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M71 50 L61 82" stroke="#a3a3a3" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
